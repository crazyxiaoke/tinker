apply plugin: 'com.android.library'

version rootProject.ext.VERSION_NAME
group rootProject.ext.GROUP

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        buildConfigField "String", "TINKER_VERSION", "\"${rootProject.ext.VERSION_NAME}\""

        manifestPlaceholders = [TINKER_VERSION: "${rootProject.ext.VERSION_NAME}"]

        consumerProguardFiles file('../consumer-proguard.txt')
    }

    lintOptions {
        disable 'LongLogTag'
    }

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    implementation project(':tinker-android:tinker-android-anno-support')
    api project(':tinker-android:tinker-android-loader')
    api project(':tinker-commons')
}

task buildTinkerSdk(type: Copy, dependsOn: [build]) {
    group = "tinker"
    from("$buildDir/outputs/aar/") {
        include "${project.getName()}-release.aar"
    }

    into(rootProject.file("buildSdk/android/"))
    rename { String fileName ->
        fileName.replace("release", "${version}")
    }
}

// Merge tinker-android-lib, tinker-android-loader and all the java-library dependencies
// (commons, anno, anno-support, aosp-dexutils, bsdiff-util, tinker-ziputils) into one fat
// aar, so the host app only needs to depend on a single local artifact.
def sdkAllDir = "$buildDir/tinkerSdkAll"

task extractSdkAllClasses(type: Copy) {
    dependsOn 'assembleRelease', ':tinker-android:tinker-android-loader:assembleRelease'
    from(zipTree("$buildDir/outputs/aar/tinker-android-lib-release.aar")) {
        include 'classes.jar'
        rename 'classes.jar', 'tinker-android-lib-classes.jar'
    }
    from(zipTree("${project(':tinker-android:tinker-android-loader').buildDir}/outputs/aar/tinker-android-loader-release.aar")) {
        include 'classes.jar'
        rename 'classes.jar', 'tinker-android-loader-classes.jar'
    }
    into "$sdkAllDir/jars"
}

task mergeSdkAllClasses(type: Zip, dependsOn: extractSdkAllClasses) {
    dependsOn ':tinker-commons:jar',
            ':tinker-android:tinker-android-anno:jar',
            ':tinker-android:tinker-android-anno-support:jar',
            ':third-party:aosp-dexutils:jar',
            ':third-party:bsdiff-util:jar',
            ':third-party:tinker-ziputils:jar'
    archiveFileName = 'classes.jar'
    destinationDirectory = file("$sdkAllDir/merged")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/**', 'TinkerAnnoApplication.tmpl'
    from({
        def jarFiles = fileTree(dir: "$sdkAllDir/jars").files.collect { zipTree(it) }
        [':tinker-commons',
         ':tinker-android:tinker-android-anno',
         ':tinker-android:tinker-android-anno-support',
         ':third-party:aosp-dexutils',
         ':third-party:bsdiff-util',
         ':third-party:tinker-ziputils'].each { jarFiles.add(zipTree(project(it).tasks.jar.outputs.files.singleFile)) }
        jarFiles
    })
}

task buildTinkerSdkAll(type: Zip, dependsOn: mergeSdkAllClasses) {
    group = "tinker"
    archiveFileName = "tinker-android-lib-${version}-all.aar"
    destinationDirectory = rootProject.file("buildSdk/android")
    from(zipTree("$buildDir/outputs/aar/tinker-android-lib-release.aar")) {
        exclude 'classes.jar'
    }
    from("$sdkAllDir/merged") {
        include 'classes.jar'
    }
}

apply from: rootProject.file('gradle/PublishArtifact.gradle')




